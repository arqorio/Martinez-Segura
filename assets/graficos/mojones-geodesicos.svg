<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" width="820" height="400" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif">
<title id="t">Mojones geodésicos: posicionamiento GNSS con base y receptor</title>
<desc id="d">Una estación base GNSS y un receptor sobre un mojón de concreto observan los mismos satélites; la línea base entre ambos da la posición del mojón. Corte del mojón con su placa.</desc>
