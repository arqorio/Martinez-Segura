<text x="230.0" y="322.0" font-size="11.5" fill="#2B1F15" text-anchor="middle" font-weight="700">Base GNSS</text>
<line x1="600" y1="242" x2="578" y2="300" stroke="#2B1F15" stroke-width="1.4"/>
<line x1="600" y1="242" x2="622" y2="300" stroke="#2B1F15" stroke-width="1.4"/>
<line x1="600" y1="242" x2="600" y2="300" stroke="#2B1F15" stroke-width="1.4"/>
