<line x1="610" y1="58" x2="600" y2="240" stroke="#B9C9CC" stroke-width="0.7" stroke-dasharray="2 4"/>
<g transform="translate(740 80)"><rect x="-7" y="-5" width="14" height="10" fill="#5C4A36"/><rect x="-24" y="-3" width="14" height="6" fill="#2F5D68"/><rect x="10" y="-3" width="14" height="6" fill="#2F5D68"/></g>
<line x1="740" y1="86" x2="230" y2="240" stroke="#B9C9CC" stroke-width="0.7" stroke-dasharray="2 4"/>
